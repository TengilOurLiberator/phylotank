[package]
name = "phylotank-scr"
description = "Windows screensaver wrapper for Phylotank (opens screensaver.html in a WebView2 window per monitor)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "phylotank-scr"
path = "src/main.rs"

[dependencies]
phylotank-common = { path = "../common" }

[target.'cfg(windows)'.dependencies]
wry.workspace = true
tao.workspace = true
windows-sys.workspace = true
