<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src http://127.0.0.1:* http://localhost:*; frame-src 'self' file: http://127.0.0.1:* http://localhost:*">
<title>Phylotank</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
#idle,#stage,.tank{position:fixed;inset:0;width:100vw;height:100vh;border:0;display:block}
#stage{pointer-events:none}
.tank{opacity:0;transition:opacity 2s ease;background:#000}
</style>
</head>
<body>
<canvas id="idle"></canvas>
<div id="stage"></div>
<script src="idle.js"></script>
<script src="loader.js"></script>
</body>
