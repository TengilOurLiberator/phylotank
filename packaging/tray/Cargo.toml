[package]
name = "phylotank-tray"
description = "Phylotank tray shell: supervises the Node host, tray menu, start with Windows (HKCU Run)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "phylotank-tray"
path = "src/main.rs"

[dependencies]
phylotank-common = { path = "../common" }

[target.'cfg(windows)'.dependencies]
tao.workspace = true
tray-icon.workspace = true
windows-sys.workspace = true
